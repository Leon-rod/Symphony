# Configuración de una obra. La genera `sym init`; editala antes de lanzar el director.

obra: {{obra}}
created_at: {{created_at}}
base_branch: {{base_branch}}

# Repos que participan. La clave es el alias que usan las partichelas (repos, territorio, criterios).
repos:
{{repos_yaml}}

# Niveles de modelo, del más barato al más caro. `afinacion` sube de a un nivel.
# `runner` tiene que existir en `runners`; `model` se inyecta en el comando como {model}.
# `reasoning` entra al comando como {reasoning} (Codex: -c model_reasoning_effort={reasoning}).
tiers:
  - id: 0
    runner: opencode
    model: qwen3.6-27b
    reasoning: low
    label: local
  - id: 1
    runner: claude-code
    model: haiku
    reasoning: low
    label: liviano
  - id: 2
    runner: claude-code
    model: sonnet
    reasoning: medium
    label: medio
  - id: 3
    runner: claude-code
    model: opus
    reasoning: high
    label: alto

# Cómo se lanza cada runner. Placeholders: {model} {reasoning} {extra} {prompt} {cwd} {id} {obra} {obra_dir} {repo_dir}
# NO pongas comillas alrededor de los placeholders: `sym` separa el template en argumentos y
# cada placeholder se convierte en UN argumento, tenga espacios o comillas adentro.
# `sym launch` imprime el comando resultante; con --exec lo ejecuta en {cwd}; con --wave lo abre en un bloque.
# Ajustá los flags a la versión que tengas instalada de cada CLI (`claude --help`, etc.).
#
# Codex: su sandbox por defecto (workspace-write) solo deja escribir en el cwd y bloquea los .git,
# y Symphony necesita escribir en la obra ({obra_dir}) y commitear en worktrees. Sin
# `-s danger-full-access` ningún nodo Codex puede funcionar. El aislamiento lo ponen los worktrees,
# el territorio y `sym check`, no el sandbox. Ver runners/codex/README.md para la alternativa con --add-dir.
runners:
  claude-code: claude --model {model} {prompt}
  codex: codex --model {model} -c model_reasoning_effort={reasoning} -s danger-full-access {extra} {prompt}
  opencode: opencode --model {model} --prompt {prompt}

# Flags extra por tipo de nodo (si no hay tipo, por kind). Se expanden en {extra}.
# Uso típico: herramientas LSP (Serena) solo para los nodos que exploran. Con Serena habilitado en
# ~/.codex/config.toml, los tipos que no exploran lo apagan para no pagar su esquema en cada turno.
launch_extra:
  mecanica: -c mcp_servers.serena.enabled=false
  local: -c mcp_servers.serena.enabled=false
  transversal: ""
  investigativa: ""
  atril: ""
  director: ""
  reparacion: ""

# Segundos que `sym wait` espera antes de volver con "sin novedades". Bajalo si tu runner corta
# los comandos antes (Claude Code: 120 s por defecto; Codex: probalo con `sym wait D --timeout 60`).
wait_timeout: 100

# Nivel por defecto con el que nace cada tipo de nodo si no se indica --tier.
default_tier:
  director: 3
  atril: 2
  tutti: 1
  reparacion: 2

# Disyuntores. Frenan loops y protegen presupuesto. No son metas.
limits:
  max_iterations_per_node: 3     # rechazos antes de waiting_human
  max_global_suite_runs: 3       # veces que el director puede correr la suite completa
  circuit_breaker_depth: 6       # profundidad máxima del árbol (segmentos del ID, sin contar D)
  max_children: 8                # hijos por nodo

afinacion:
  same_criterion_iterations: 2   # mismo criterio fallando N veces → sube de nivel
  auto_upgrade_up_to_tier: 2     # hasta acá el padre sube solo; más arriba pide al humano

tests:
  scope: own                     # cada nodo corre solo sus criterios; la suite completa, solo D
  # Patrones que `sym check` busca en el diff del nodo. Si aparece uno, el check falla.
  forbidden_patterns:
    - NO_ERRORS_SCHEMA
    - CUSTOM_ELEMENTS_SCHEMA
    - "\\bfit\\("
    - "\\bfdescribe\\("
    - "\\bxit\\("
    - "\\bxdescribe\\("
    - "\\.only\\("
    - "\\.skip\\("
    - "expect\\(true\\)\\.toBe\\(true\\)"
